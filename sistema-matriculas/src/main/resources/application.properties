spring.application.name=sistema-matriculas

# Banco H2 em modo arquivo (persistencia local, atende o requisito do Lab01S03)
spring.datasource.url=jdbc:h2:file:./data/matriculas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Aplicacao de linha de comando: sem servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
