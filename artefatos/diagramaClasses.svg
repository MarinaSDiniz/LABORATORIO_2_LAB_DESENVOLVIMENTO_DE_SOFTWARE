<text x="1192" y="886" class="nota">Regras garantidas na camada service:</text>
<text x="1192" y="903" class="nota">• Aluno: até 4 obrigatórias e 2 optativas</text>
<text x="1192" y="920" class="nota">  por semestre (US03, US04)</text>
<text x="1192" y="937" class="nota">• Disciplina: máximo 60 inscritos; ao atingir,</text>
<text x="1192" y="954" class="nota">  as inscrições são encerradas (US02, US03)</text>
<text x="1192" y="971" class="nota">• Disciplina: mínimo 3 inscritos ao fim do</text>
<text x="1192" y="988" class="nota">  período, senão é cancelada (US06)</text>
<text x="1192" y="1005" class="nota">• Matrícula e cancelamento só com o período</text>
<text x="1192" y="1022" class="nota">  do Semestre aberto (US05)</text>
